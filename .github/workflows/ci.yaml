name: ci

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  semantic-pull-request:
    if: github.event_name == 'pull_request'
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      includes: |
        **/*.md
        !**/third_party/**
      modified_files_only: false

  packages:
    name: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: javascript
            os: ubuntu-latest
          - package: javascript_platform_interface
            os: ubuntu-latest
          - package: javascript_android
            os: ubuntu-latest
          # The darwin tests exercise the real JavaScriptCore runtime, which
          # only exists on macOS hosts.
          - package: javascript_darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  example-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packages/javascript/example
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Integration tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # A recent image so the WebView is new enough for message ports and
          # promise results; the transport test skips what the device lacks.
          api-level: 36
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: packages/javascript/example
          script: flutter test integration_test -d emulator-5554

  example-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/javascript/example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Start simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) for x in d[k] if x["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # A simulator booted only via simctl never surfaces the app's
          # "Dart VM Service is listening" log line on the hosted macOS
          # runners, so `flutter test -d` waits forever after the Xcode
          # build. Opening Simulator.app on the booted device fixes it.
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 15

      - name: Integration tests (simulator)
        # android_transports_test.dart is Android-only; launching a second app
        # in one run is also flaky on Apple targets, so run the contract file.
        # Under load the hosted runners occasionally never deliver the VM
        # service line and `flutter test` hangs after the build, so each
        # attempt runs under a watchdog and only a hang (SIGALRM, exit 142)
        # is retried; real test failures exit immediately.
        run: |
          UDID=${{ steps.simulator.outputs.udid }}
          for attempt in 1 2 3; do
            perl -e 'alarm shift; exec @ARGV' 600 \
              flutter test integration_test/javascript_test.dart -d "$UDID" && exit 0
            status=$?
            [ "$status" -eq 142 ] || exit "$status"
            echo "::warning::attempt $attempt hung waiting for the app; retrying"
            xcrun simctl terminate "$UDID" com.example.javascriptExample || true
          done
          exit 1

      - name: Shut down simulator
        # The runner's "Complete job" cleanup can hang for a long time
        # terminating an orphaned Simulator.app, so close it ourselves.
        if: always()
        run: |
          osascript -e 'quit app "Simulator"' || true
          xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" || true

  example-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/javascript/example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Integration tests (macOS desktop)
        # Same watchdog-and-retry as the simulator job: only a hang is retried.
        run: |
          for attempt in 1 2 3; do
            perl -e 'alarm shift; exec @ARGV' 600 \
              flutter test integration_test/javascript_test.dart -d macos && exit 0
            status=$?
            [ "$status" -eq 142 ] || exit "$status"
            echo "::warning::attempt $attempt hung waiting for the app; retrying"
            pkill -f javascript_example.app || true
          done
          exit 1
