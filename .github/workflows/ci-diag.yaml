name: ci-diag

on:
  push:
    branches:
      - 'ci-diag/**'
  workflow_dispatch:

jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: "37.0"
            target: ${{ matrix.target }}
          - api-level: "37.1"
            target: google_apis_ps16k
          - api-level: "37.2"
            target: google_apis_ps16k
    name: android-${{ matrix.api-level }}-${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packages/javascript/example
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Integration tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: packages/javascript/example
          script: |
            adb shell dumpsys webviewupdate | grep -iE 'Current WebView package|versionName' | head -3
            flutter test integration_test/android_transports_test.dart -d emulator-5554
