version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pub"
    directories:
      - "/packages/javascript"
      - "/packages/javascript/example"
      - "/packages/javascript_platform_interface"
      - "/packages/javascript_android"
      - "/packages/javascript_darwin"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gradle"
    directories:
      - "/packages/javascript_android/android"
      - "/packages/javascript/example/android"
    schedule:
      interval: "weekly"
